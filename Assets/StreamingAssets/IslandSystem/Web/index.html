<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'"><title>荒岛智能系统 · Scratch 积木编辑器</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>荒岛智能系统</h1><nav><button id="free" aria-pressed="true">自由编程</button><button id="guide" aria-pressed="false">任务引导</button></nav><span id="save" role="status">正在恢复草稿…</span><button id="close" aria-label="关闭系统">×</button></header>
<main><div id="blocks" aria-label="Scratch 积木工作区"></div><aside id="task" hidden><h2>动作教学：连续跳跃</h2><p>目标：让角色真实跳跃3次。</p><p>推荐积木：事件、控制、动作。</p><div id="progress"></div><ol id="hints"></ol><button id="hint">下一条提示</button><small>自己拖拽完成，可以采用不同的合法结构。</small></aside></main>
<footer><div class="tools"><input id="name" aria-label="程序名称" maxlength="60" value="我的荒岛程序"><span id="count">0 个积木</span><button id="check">程序检查</button><button id="undo">撤销</button><button id="redo">重做</button><button id="preview">预览 [F5]</button><button id="run" class="primary">运行角色动作</button></div><div id="report" role="status" tabindex="0">真实动作：跳跃、砍伐、向前移动、转向。演示和待接入积木只能预览。</div><small>积木编辑由 Scratch Blocks 官方核心提供 · 按 Tab / Esc 关闭</small></footer>
<script src="app.js"></script></body></html>
